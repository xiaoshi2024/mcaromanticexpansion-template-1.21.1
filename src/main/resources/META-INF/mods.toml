modLoader="javafml"
loaderVersion="${loader_version_range}"
license="${mod_license}"

[[mods]]
modId="${mod_id}"
version="${mod_version}"
displayName="${mod_name}"
displayURL="https://space.bilibili.com/1410016591"
logoFile="mre.png"
authors="${mod_authors}"
description='''
MCA Romantic Expansion adds romantic interactions to MCA mod.
Features:
- Flower Bouquet: Right-click players to open romance GUI
- Engagement Ring: Propose marriage to opposite gender players
- Wedding Ring: Complete marriage ceremony
- Relationship tracking and special interactions
'''

[[mixins]]
config="${mod_id}.mixins.json"

[[dependencies.${mod_id}]]
    modId="forge"
    mandatory=true
    versionRange="${forge_version_range}"
    ordering="NONE"
    side="BOTH"

[[dependencies.${mod_id}]]
    modId="minecraft"
    mandatory=true
    versionRange="${minecraft_version_range}"
    ordering="NONE"
    side="BOTH"

[[dependencies.${mod_id}]]
    modId="mca"
    mandatory=true
    versionRange="[6.0,)"
    ordering="NONE"
    side="BOTH"