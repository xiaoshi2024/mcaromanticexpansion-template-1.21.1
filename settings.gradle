pluginManagement {
    repositories {
        gradlePluginPortal()
    }
}

plugins {
    // 1.0.0+ is required for Gradle 9: pre-1.0.0 versions reference the
    // JvmVendorSpec.IBM_SEMERU constant that was removed in Gradle 9, causing
    // NoSuchFieldError when auto-provisioning the Java 25 toolchain.
    id 'org.gradle.toolchains.foojay-resolver-convention' version '1.0.0'
}