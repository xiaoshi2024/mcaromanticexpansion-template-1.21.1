plugins {
    id 'java-library'
    id 'maven-publish'
    id 'net.neoforged.moddev' version '2.0.144'
    id 'idea'
}

// ❌ 删除所有 mixin 相关配置
// 不需要 mixin {} 块
// 不需要 neoForge { mixin {} }

tasks.named('wrapper', Wrapper).configure {
    distributionType = Wrapper.DistributionType.BIN
}

version = mod_version
group = mod_group_id

sourceSets.main.resources {
    srcDir('src/generated/resources')
    exclude("**/*.bbmodel")
    exclude("src/generated/**/.cache")
    exclude("**/*.bbmodel")
    exclude("**/.cache")
    exclude("**/.cache/**")
    exclude("opencode.json")
    exclude("INSTRUCTIONS.md")
    exclude("mc-src/**")
    exclude(".opencode/**")
    exclude("base-mod-api/**")
    exclude("base-mod-src/**")
}

repositories {
    // Add here additional repositories if required by some of the dependencies below.
}

base {
    archivesName = 'mcaromanticexpansion'
}

java.toolchain.languageVersion = JavaLanguageVersion.of(25)

neoForge {
    version = project.neo_version

    runs {
        client {
            client()
            systemProperty 'neoforge.enabledGameTestNamespaces', project.mod_id
        }

        server {
            server()
            programArgument '--nogui'
            systemProperty 'neoforge.enabledGameTestNamespaces', project.mod_id
        }

        gameTestServer {
            type = "gameTestServer"
            systemProperty 'neoforge.enabledGameTestNamespaces', project.mod_id
        }

        data {
            clientData()
            programArguments.addAll '--mod', project.mod_id, '--all', '--output', file('src/generated/resources/').getAbsolutePath(), '--existing', file('src/main/resources/').getAbsolutePath()
        }

        configureEach {
            systemProperty 'forge.logging.markers', 'REGISTRIES'
            logLevel = org.slf4j.event.Level.DEBUG
        }
    }

    mods {
        "${mod_id}" {
            sourceSet(sourceSets.main)
        }
    }
}

configurations {
    runtimeClasspath.extendsFrom localRuntime
}

dependencies {
    // ===== 添加 Mixin 注解处理器（必需） =====
    annotationProcessor 'org.spongepowered:mixin:0.8.5:processor'

    // 可选：编译时依赖
    // compileOnly 'org.spongepowered:mixin:0.8.5'

    implementation 'maven.modrinth:curios:BI7D0sbK'
    implementation 'maven.modrinth:minecraft-comes-alive-reborn:rFaWMUkA'
    implementation fileTree(dir: 'base-mod-libs', include: ['*.jar'])
    compileOnly fileTree(dir: 'base-mod-compile-libs', include: ['*.jar'])
}

var generateModMetadata = tasks.register("generateModMetadata", ProcessResources) {
    var replaceProperties = [
            minecraft_version      : minecraft_version,
            minecraft_version_range: minecraft_version_range,
            neo_version            : neo_version,
            mod_id                 : mod_id,
            mod_name               : mod_name,
            mod_license            : mod_license,
            mod_version            : mod_version,
    ]
    inputs.properties replaceProperties
    expand replaceProperties
    from "src/main/templates"
    into "build/generated/sources/modMetadata"
}

sourceSets.main.resources.srcDir generateModMetadata
neoForge.ideSyncTask generateModMetadata

publishing {
    publications {
        register('mavenJava', MavenPublication) {
            from components.java
        }
    }
    repositories {
        maven {
            url "file://${project.projectDir}/repo"
        }
    }
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
}

idea {
    module {
        downloadSources = true
        downloadJavadoc = true
    }
}

processResources {
    duplicatesStrategy = DuplicatesStrategy.EXCLUDE
}

// --- NeoForge Maven mirror ---
repositories.all {
    if (it instanceof org.gradle.api.artifacts.repositories.MavenArtifactRepository) {
        def u = it.url.toString()
        if (u.startsWith('https://maven.neoforged.net/')) {
            it.url = u.replace('https://maven.neoforged.net/', 'https://neoforged.forgecdn.net/')
        }
    }
}

repositories {
    maven { url "${projectDir}/.oss-basemod-repo" }
    maven { url 'https://api.modrinth.com/maven' }
}

configurations {
    nfrtExternalTools {
        description = 'NFRT pipeline tools resolved via the mirror for the artifact manifest'
        canBeConsumed = false
        canBeResolved = true
    }
}

dependencies {
    nfrtExternalTools 'net.neoforged.installertools:binarypatcher:4.0.17:fatjar'
    nfrtExternalTools 'net.neoforged.installertools:installertools:4.0.16:fatjar'
    nfrtExternalTools 'org.vineflower:vineflower:1.12.0'
    nfrtExternalTools 'net.neoforged:vineflower-plugins:0.1.6'
}

tasks.named('createMinecraftArtifacts').configure {
    addArtifactsToManifest configurations.nfrtExternalTools
}